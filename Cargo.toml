[package]
name = "coro"
version = "0.3.0"
description = "Stackful, first-class asymmetric coroutines."
authors = ["Hugo Sanz González <hugo@hgsg.me>"]
license = "MIT"
documentation = "https://docs.rs/coro"
repository = "https://github.com/hsanzg/coro"
keywords = ["coroutines", "stackful"]
categories = ["concurrency"]
edition = "2024"

[features]
default = ["common_pool"]
stack_alloc = []
common_pool = ["stack_alloc"]
valgrind = []

[dependencies]
coro_macros = { version = "1", path = "macros" }
libc = "0.2"

[profile.bench]
debug = true

[workspace]
members = ["macros", "benchs"]
