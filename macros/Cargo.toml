[package]
name = "coro_macros"
version = "1.0.0"
description = "Procedural macros for internal use by the `coro` crate."
authors = ["Hugo Sanz González <hugo@hgsg.me>"]
license = "MIT"
repository = "https://github.com/hsanzg/coro"
publish = false
edition = "2024"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
