name: test
on: [ push, pull_request ]

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo test
      - run: cargo test --no-default-features --features stack_alloc
      - run: |
          cargo test -Z panic-abort-tests \
                     --config 'profile.dev.panic="abort"' \
                     --config 'build.rustdocflags=["-Cpanic=abort"]'
